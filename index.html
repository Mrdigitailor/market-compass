<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="סקירת מתחרים דיגיטלית שבועית — נוכחות ברשתות, פרסום, אתר וקצב תוכן, מול אלמה ישראל.">
<meta property="og:type" content="website">
<meta property="og:title" content="מצפן תחרות · אלמה ישראל">
<meta property="og:description" content="סקירת מתחרים דיגיטלית שבועית — נוכחות ברשתות, פרסום, אתר וקצב תוכן, מול אלמה ישראל.">
<meta property="og:locale" content="he_IL">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<title>מצפן תחרות אלמה ישראל</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&amp;family=Open+Sans:wght@400;600;700&display=swap">

<style>
/* ─────────────────────────────────────────────────────────────
   משפחת גופנים אחת, הרבה משקלים. הפרדה בחלל ולא בקווים.
   צבע כמעט לא קיים — כחול אחד לפעולה, כתום אחד לצד השני.
   ───────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────
   הטוקנים נגזרים מפלטת המותג שבקונפיג הלקוח, לא מוגדרים כאן.
   המצב הבהיר הוא הפלטה כלשונה; הכהה נגזר ממנה ב-HSL כדי לשמר
   את זהות הצבע במקום להלבין אותו לאפור.
   ───────────────────────────────────────────────────────────── */
:root{
  --brand:#442C5C;
  --brand-ink:#2B183E;
  --brand-soft:#ECEAEF;
  --accent:#FFBD98;
  --accent-soft:#FFE6D8;
  --rival:#B4532A;
  --rival-soft:#F6EAE5;
  --bg:#FFFFFF;
  --bg2:#F7F4F6;
  --bg3:#FBFBFC;
  --ink:#120B0E;
  --ink2:#525252;
  --ink3:#8A8A8A;
  --line:#EDE8E8;
  --lineSoft:#F5F2F2;
  --pos:#2C7A57;
  --warn:#A07000;
  --neg:#A80000;
  --glass:rgba(255,255,255,.82);
  --fd:"Frank Ruhl Libre",Georgia,serif;
  --f:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#B291D4;
  --brand-ink:#CCB7E1;
  --brand-soft:#291A37;
  --accent:#FFBD98;
  --accent-soft:#471A00;
  --rival:#E89673;
  --rival-soft:#3E1D0E;
  --bg:#08040B;
  --bg2:#100918;
  --bg3:#0C0711;
  --ink:#F4F1F4;
  --ink2:#B8B0BF;
  --ink3:#8C8296;
  --line:#382E42;
  --lineSoft:#241D2A;
  --pos:#71CCA3;
  --warn:#FFCB52;
  --neg:#F25F5F;
  --glass:rgba(10,6,12,.78);
}}
:root[data-theme="dark"]{
  --brand:#B291D4;
  --brand-ink:#CCB7E1;
  --brand-soft:#291A37;
  --accent:#FFBD98;
  --accent-soft:#471A00;
  --rival:#E89673;
  --rival-soft:#3E1D0E;
  --bg:#08040B;
  --bg2:#100918;
  --bg3:#0C0711;
  --ink:#F4F1F4;
  --ink2:#B8B0BF;
  --ink3:#8C8296;
  --line:#382E42;
  --lineSoft:#241D2A;
  --pos:#71CCA3;
  --warn:#FFCB52;
  --neg:#F25F5F;
  --glass:rgba(10,6,12,.78);
}

*{box-sizing:border-box}
body{direction:rtl;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:19px;line-height:1.5;font-weight:400;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
button,select,input{font-family:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--brand);outline-offset:4px;border-radius:8px}

/* מכל מרכזי אחיד — הכל מתיישר אליו */
.mid{max-width:1000px;margin:0 auto;padding:0 26px;text-align:center}
.narrow{max-width:660px;margin-inline:auto}
.wide{max-width:1140px;margin:0 auto;padding:0 26px;text-align:center}

/* ── טיפוגרפיה ─────────────────────────────── */
.eyebrow{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:.005em;margin:0 0 14px}
.eyebrow.blue{color:var(--brand)}
h1.mega{font-family:var(--fd);font-size:clamp(40px,7.4vw,80px);font-weight:800;line-height:1.05;
  letter-spacing:-.032em;margin:0;text-wrap:balance}
h2.big{font-family:var(--fd);font-size:clamp(30px,4.6vw,50px);font-weight:800;line-height:1.09;
  letter-spacing:-.028em;margin:0 0 16px;text-wrap:balance}
h3.mid-t{font-family:var(--fd);font-size:clamp(23px,3vw,33px);font-weight:700;line-height:1.16;
  letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
.lead{font-size:clamp(18px,2.1vw,23px);font-weight:400;color:var(--ink2);
  line-height:1.42;letter-spacing:-.012em;margin:18px auto 0;max-width:44ch}
.body{font-size:18px;color:var(--ink2);line-height:1.55;margin:14px auto 0;max-width:56ch}
.fine{font-size:14.5px;color:var(--ink3);line-height:1.5;margin:12px auto 0;max-width:60ch}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ── מקטעים ────────────────────────────────── */
.sect{padding:104px 0}
.sect.tight{padding:72px 0}
.sect.grey{background:var(--bg2)}
.sect.first{padding-top:56px}

/* ── כניסה ─────────────────────────────────── */
.enter{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:70px 26px 56px}
.mark{display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:30px}
.mark .logo{color:var(--brand);width:172px}
.mark .logo svg{width:100%;height:auto;display:block}
.mark span{font-size:13.5px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
.topbar .logo{color:var(--brand);width:86px;flex:none}
.topbar .logo svg{width:100%;height:auto;display:block}

/* בורר מגזרי בסגנון iOS */
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;
  margin:44px auto 0;gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:10px 26px;
  font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer;
  transition:color .2s,background .2s;letter-spacing:-.01em;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.09)}
:root[data-theme="dark"] .seg button[aria-selected="true"]{box-shadow:0 1px 3px rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-selected="true"]{box-shadow:0 1px 3px rgba(0,0,0,.6)}}

.control{margin-top:30px;width:100%;max-width:452px;display:flex;flex-direction:column;
  gap:12px;align-items:stretch}
.sel-wrap{position:relative}
select.big,input.big{width:100%;padding:17px 22px;border:1px solid var(--line);
  border-radius:15px;background:var(--bg);font-size:18px;font-weight:500;
  text-align:center;text-align-last:center;appearance:none;transition:border-color .2s,box-shadow .2s;
  letter-spacing:-.012em}
select.big:hover,input.big:hover{border-color:var(--ink3)}
select.big:focus,input.big:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 4px var(--brand-soft)}
input.big{text-align:center}
input.big::placeholder{color:var(--ink3);font-weight:400}

.cta{padding:16px 34px;border:none;border-radius:999px;background:var(--brand);color:#fff;
  font-size:18px;font-weight:600;cursor:pointer;transition:transform .16s,filter .16s;
  letter-spacing:-.012em}
.cta:hover{filter:brightness(1.09);transform:scale(1.018)}
.cta:active{transform:scale(.988)}
.cta.warm{background:var(--rival)}
.cta:disabled{opacity:.4;cursor:not-allowed;transform:none}

.hint{margin-top:20px;font-size:15px;color:var(--ink3);max-width:40ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:7px 17px;font-size:15px;font-weight:500;color:var(--ink2);cursor:pointer;
  transition:all .18s}
.chip:hover{border-color:var(--rival);color:var(--rival)}

/* קופסת הצצה — ללא מסגרת, רק רקע רך */
.peek{margin-top:4px;background:var(--bg2);border-radius:15px;padding:20px 22px}
.peek .own{margin:0 auto}
.peekrow{display:flex;justify-content:center;gap:34px;margin-top:15px;flex-wrap:wrap}
.peekrow>div{display:flex;flex-direction:column;gap:2px}
.peekrow .k{font-size:13px;color:var(--ink3);font-weight:400}
.peekrow b{font-size:22px;font-weight:600;letter-spacing:-.02em}

/* תג בעלות */
.own{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  padding:8px 18px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.own::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.own.owner{background:var(--brand-soft);color:var(--pos)}
.own.reseller{background:var(--rival-soft);color:var(--rival)}
.own.group{background:var(--brand-soft);color:var(--brand)}
.own.unknown{background:var(--bg2);color:var(--ink3)}

/* ניווט תחתון בכניסה */
.scrollcue{margin-top:auto;padding-top:52px;font-size:14px;color:var(--ink3)}

/* ── סרגל חזרה צף ──────────────────────────── */
.topbar{position:sticky;top:0;z-index:50;background:var(--glass);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--lineSoft)}
.topbar .in{max-width:1140px;margin:0 auto;padding:13px 26px;display:flex;
  align-items:center;gap:16px}
.back{background:none;border:none;font-size:16px;font-weight:500;color:var(--brand);
  cursor:pointer;padding:4px 0;letter-spacing:-.01em}
.back:hover{text-decoration:underline}
.topbar .who{font-size:15px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .when{margin-inline-start:auto;font-size:13px;color:var(--ink3);white-space:nowrap}

/* ── גיבור מוצר ────────────────────────────── */
.phero{padding:76px 0 68px;text-align:center}
.phero .av{width:104px;height:104px;border-radius:50%;margin:0 auto 26px;overflow:hidden;
  background:var(--bg2)}
.phero .av img{width:100%;height:100%;object-fit:cover}

/* ── מספר ענק ──────────────────────────────── */
.stat{font-family:var(--fd);font-size:clamp(52px,9vw,104px);font-weight:800;line-height:1;
  letter-spacing:-.042em;font-variant-numeric:tabular-nums}
.stat.us{color:var(--brand)} .stat.them{color:var(--rival)}
.statlbl{font-size:16px;color:var(--ink2);margin-top:12px;font-weight:400}

/* ── השוואה ────────────────────────────────── */
.duel{display:grid;gap:0;max-width:820px;margin:0 auto}
.duelrow{padding:30px 0;border-bottom:1px solid var(--lineSoft)}
.duelrow:last-child{border-bottom:none}
.duelrow .cap{font-size:16px;font-weight:500;color:var(--ink2);margin-bottom:16px}
.duelrow .pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.duelrow .side{min-width:0}
.duelrow .side .v{font-family:var(--fd);font-size:clamp(28px,5vw,46px);font-weight:700;line-height:1;
  letter-spacing:-.032em;font-variant-numeric:tabular-nums}
.duelrow .a .v{color:var(--brand)} .duelrow .b .v{color:var(--rival)}
.duelrow .side .nm{font-size:13px;color:var(--ink3);margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duelrow .side .dl{font-size:13px;margin-top:4px;color:var(--ink3);font-variant-numeric:tabular-nums}
.duelrow .dl.up{color:var(--pos)} .duelrow .dl.down{color:var(--neg)}
.duelrow .mid-badge{font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap;
  background:var(--bg2);border-radius:999px;padding:6px 14px}
.duelrow .mid-badge.us{color:var(--brand)} .duelrow .mid-badge.them{color:var(--rival)}
.rail{height:4px;border-radius:999px;background:var(--lineSoft);display:flex;
  overflow:hidden;margin-top:18px}
.rail i{display:block;height:100%}
.rail .ra{background:var(--brand)} .rail .rb{background:var(--rival)}

/* ── תמונות מוצר ───────────────────────────── */
.pair2{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  max-width:980px;margin:0 auto}
.shot{text-align:center}
.shot .im{border-radius:20px;overflow:hidden;background:var(--bg2);aspect-ratio:16/10;
  box-shadow:0 2px 10px rgba(0,0,0,.06),0 20px 50px -28px rgba(0,0,0,.34)}
:root[data-theme="dark"] .shot .im{box-shadow:0 2px 10px rgba(0,0,0,.5),0 20px 50px -28px rgba(0,0,0,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shot .im{box-shadow:0 2px 10px rgba(0,0,0,.5),0 20px 50px -28px rgba(0,0,0,1)}}
.shot .im img{width:100%;height:100%;object-fit:cover;object-position:top center}
.shot .im .no{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--ink3);font-size:15px}
.shot .nm{margin-top:16px;font-size:17px;font-weight:600;letter-spacing:-.014em}
.shot .u{font-size:13.5px;color:var(--ink3);margin-top:3px}

/* ── ממצאים ────────────────────────────────── */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));
  max-width:1000px;margin:0 auto}
.card{background:var(--bg2);border-radius:20px;padding:30px 26px;text-align:center}
.sect.grey .card{background:var(--bg)}
.card .mk{width:42px;height:42px;border-radius:50%;margin:0 auto 16px;display:flex;
  align-items:center;justify-content:center;font-size:19px;font-weight:700}
.card.pos .mk{background:var(--brand-soft);color:var(--pos)}
.card.neg .mk{background:var(--rival-soft);color:var(--neg)}
.card.warn .mk{background:var(--rival-soft);color:var(--rival)}
.card.info .mk{background:var(--brand-soft);color:var(--brand)}
.card h4{margin:0 0 9px;font-size:19px;font-weight:700;letter-spacing:-.018em;line-height:1.28}
.card p{margin:0;font-size:15.5px;color:var(--ink2);line-height:1.5}
.card a{display:inline-block;margin-top:11px;font-size:14.5px;font-weight:500}

/* ── רשימה נקייה במקום טבלה ────────────────── */
.rows{max-width:820px;margin:0 auto;text-align:start}
.row{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
  padding:19px 4px;border-bottom:1px solid var(--lineSoft)}
.row:last-child{border-bottom:none}
.row .t{font-size:17px;font-weight:600;letter-spacing:-.014em;
  overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--ink3);margin-top:3px;line-height:1.4}
.row .q{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.comp .t{color:var(--rival)} .row.client .t{color:var(--brand)}

/* ── פסי קצב ───────────────────────────────── */
.metric{max-width:700px;margin:0 auto;text-align:start}
.metric .mrow{padding:15px 0}
.metric .mhead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:15.5px;margin-bottom:9px}
.metric .mhead b{font-weight:600;letter-spacing:-.012em}
.metric .mhead span{color:var(--ink3);font-size:14px;font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:999px;background:var(--lineSoft);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px}

/* ── סריקה ─────────────────────────────────── */
.grid4{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  max-width:1000px;margin:0 auto}
.tile{background:var(--bg2);border-radius:20px;padding:32px 22px;text-align:center}
.sect.grey .tile{background:var(--bg)}
.tile .v{font-family:var(--fd);font-size:52px;font-weight:800;line-height:1;letter-spacing:-.038em;
  font-variant-numeric:tabular-nums}
.tile.competitor .v{color:var(--rival)}
.tile.client .v{color:var(--brand)}
.tile.channel .v{color:var(--pos)}
.tile.gray_market .v{color:var(--ink2)}
.tile .k{font-size:16.5px;font-weight:600;margin-top:14px;letter-spacing:-.014em}
.tile .d{font-size:14px;color:var(--ink3);margin-top:7px;line-height:1.45}

/* בחירת מילות מפתח */
.kwline{display:flex;gap:9px;align-items:stretch}
.kwline .big{flex:1;text-align:start;text-align-last:start}
.add{width:54px;flex:none;border:1.5px solid var(--line);background:var(--bg2);
  border-radius:15px;font-size:26px;font-weight:400;line-height:1;color:var(--brand);
  cursor:pointer;transition:all .16s;font-family:inherit}
.add:hover{border-color:var(--brand);background:var(--brand-soft)}
.kwsug{font-size:13.5px;color:var(--ink3);margin:14px 0 2px}
.kw .x{margin-inline-start:7px;opacity:.65;font-weight:400}
.kw.picked{background:var(--brand);border-color:var(--brand);color:#fff}
.kw.unres{border-style:dashed}
.kwpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.kw{border:1.5px solid var(--line);background:transparent;border-radius:999px;
  padding:9px 17px;font-size:15px;font-weight:500;color:var(--ink2);cursor:pointer;
  transition:all .16s;font-family:inherit}
.kw:hover{border-color:var(--brand);color:var(--brand)}
.kw[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.kwcount{font-size:13.5px;color:var(--ink3);margin-top:4px}

/* תוצאה אורגנית */
.serp{max-width:760px;margin:0 auto;text-align:start}
.serp .r{display:grid;grid-template-columns:38px 1fr;gap:15px;padding:19px 0;
  border-bottom:1px solid var(--lineSoft);align-items:start}
.serp .r:last-child{border-bottom:none}
.serp .pos{font-family:var(--fd);font-size:23px;font-weight:700;color:var(--ink3);
  text-align:center;line-height:1.2}
.serp .t{font-size:16.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.serp .u{font-size:13px;color:var(--ink3);margin-top:3px;direction:ltr;text-align:right}
.serp .sn{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.45}
.tagv{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;
  padding:3px 11px;margin-top:8px;letter-spacing:.01em}
.tagv.competitor{background:var(--rival-soft);color:var(--rival)}
.tagv.client{background:var(--brand-soft);color:var(--brand)}
.tagv.channel{background:var(--accent-soft);color:var(--ink2)}
.tagv.other{background:var(--bg2);color:var(--ink3)}

.verdictbox{max-width:620px;margin:0 auto;padding:30px 26px;border-radius:20px;
  background:var(--bg2);text-align:center}
.sect.grey .verdictbox{background:var(--bg)}
.verdictbox .big-i{font-size:46px;font-weight:800;font-family:var(--fd);line-height:1}
.verdictbox.bad .big-i{color:var(--rival)}
.verdictbox.good .big-i{color:var(--pos)}
.verdictbox p{margin:12px 0 0;font-size:16px;color:var(--ink2);line-height:1.5}

.loading{display:flex;flex-direction:column;align-items:center;gap:20px;padding:76px 0;
  color:var(--ink2);font-size:17px}
.spin{width:30px;height:30px;border:2.5px solid var(--lineSoft);border-top-color:var(--brand);
  border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── תנועה עדינה ───────────────────────────── */

  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

function dec(v){ return v == null ? "—" : (Math.round(v*10)/10).toLocaleString("he-IL"); }
function sign(v){ return v == null ? "" : (v > 0 ? "+" : "") + Math.round(v).toLocaleString("he-IL"); }

/* window.claude קיים רק בתוך הצופה של claude.ai. בעותק שמור או בשרת
   אחר הוא פשוט לא שם — קריאה ישירה תזרוק ותשבור את הדף. */
async function cap(name){
  try{
    var c = window.claude;
    if(!c || typeof c.use !== "function") return null;
    return await c.use(name);
  }catch(e){ return null; }
}

var io = null;
function reveal(root){
  var els = (root || document).querySelectorAll(".rev");
  if(!("IntersectionObserver" in window) ||
     matchMedia("(prefers-reduced-motion: reduce)").matches){
    [].forEach.call(els, function(e){ e.classList.add("in"); }); return;
  }
  if(!io) io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, {rootMargin:"0px 0px -8% 0px", threshold:.06});
  [].forEach.call(els, function(e){ io.observe(e); });
}
function show(which){
  HOME.hidden = which !== "home";
  REP.hidden  = which !== "report";
  SCAN.hidden = which !== "scan";
  window.scrollTo(0,0);

   "ttTop");

  /* ── מודעות: מה הם מריצים. במכוון בלי השוואה אלינו. ── */
  h += adsSection(t);

  /* אתרים — רק מול מתחרה שמוכר מוצר ספציפי */

    + '<div class="rev"><p class="eyebrow">אתרים</p><h2 class="big">דף מול דף</h2>'

    h += contentSection(c, t);
  } else {
    h += '<div class="sect grey"><div class="mid rev">'
      + '<p class="eyebrow">אתר</p><h2 class="big">לא מושווה כאן, במכוון</h2>'

  var evs = D.events.filter(function(e){ return e.entity === t.id || e.entity === c.id; });

function duel(label, c, t, key, isDec){
  var a = c.m[key], b = t.m[key], av = val(a), bv = val(b);
  var tot = (av||0)+(bv||0), pa = tot ? (av||0)/tot*100 : 50;
  var badge = "";
  if(av != null && bv != null && av !== bv){
    var better = av > bv;
    var r = better ? (bv ? av/bv : null) : (av ? bv/av : null);
    badge = '<span class="mid-badge '+(better?"us":"them")+'">'
          + (better ? "אנחנו" : "הם") + (r && isFinite(r) ? " · פי "+dec(r) : "") + "</span>";
  } else badge = '<span class="mid-badge">מול</span>';
  function sideHtml(cls, ent, mm, v){
    return '<div class="side '+cls+'"><div class="v">'+(isDec ? dec(v) : num(v))+"</div>"
      + '<div class="nm">'+esc(ent.name)+"</div>"
      + '<div class="dl'+(mm && !mm.stale && mm.diff > 0 ? " up" : mm && !mm.stale && mm.diff < 0 ? " down" : "")+'">'
      + (!mm ? "" : mm.stale ? "נמדד "+esc(mm.asOf||"") : mm.diff == null ? "מדידת בסיס"
         : mm.diff === 0 ? "ללא שינוי" : (mm.diff > 0 ? "▲ " : "▼ ") + sign(mm.diff))
      + "</div></div>";
  }
  return '<div class="duelrow"><div class="cap">'+esc(label)+"</div>"
    + '<div class="pair">'+sideHtml("a", c, a, av)+badge+sideHtml("b", t, b, bv)+"</div>"
    + '<div class="rail"><i class="ra" style="width:'+pa.toFixed(1)+'%"></i>'
    + '<i class="rb" style="width:'+(100-pa).toFixed(1)+'%"></i></div></div>';
}

function platformSection(title, c, t, rows, note, topKey){
  var any = rows.some(function(r){ return val(c.m[r[1]]) != null || val(t.m[r[1]]) != null; });

    + '<p class="body">' + esc(c.name) + " מול " + esc(t.name) + ".</p></div>"
    + '<div class="duel rev" style="margin-top:40px">';
  rows.forEach(function(r){ h += duel(r[0], c, t, r[1], r[2]); });
  h += "</div>";
  if(topKey && (c[topKey] || t[topKey])){
    h += '<div class="pair2 rev" style="margin-top:46px">'
      + topVideoCard(c, c[topKey], "us") + topVideoCard(t, t[topKey], "them") + "</div>";

function engagementInsight(c, t){
  var ce = val(c.m.engagement), te = val(t.m.engagement);
  var cf = val(c.m.instagram),  tf = val(t.m.instagram);
  if(ce == null || te == null) return "";
  var out = "";
  if(te > ce && cf && tf && cf > tf){
    out += card("neg", "!", "הקהל שלהם מעורב יותר, גם אם קטן בהרבה",
      "יש לנו פי " + dec(cf / tf) + " עוקבים, אבל אחוז המעורבות שלהם גבוה פי "
      + dec(te / ce) + ". קהל גדול שלא מגיב שווה פחות מקהל קטן שכן.");
  }
  var BENCH = 1.0;   // 1%-3% נחשב תקין באינסטגרם
  if(ce < BENCH)
    out += card("warn", "!", "המעורבות שלנו מתחת לבנצ׳מרק",
      dec(ce) + "% מול טווח מקובל של 1%–3%. עם " + num(cf)
      + " עוקבים זה אומר שרוב הקהל לא רואה או לא מגיב.");
  else
    out += card("pos", "✓", "המעורבות שלנו בטווח התקין",
      dec(ce) + "% — בתוך הטווח המקובל של 1%–3%.");
  out += card("info", "◆", "איך זה נמדד",
    "ממוצע לייקים ותגובות לפוסט, חלקי מספר העוקבים, על 12 הפוסטים האחרונים. "
    + "שמירות ושיתופים אינם כלולים — הם מדדים פרטיים שאינם גלויים לאיש מלבד בעל החשבון.");
  return out;
}

function siteFindings(c, t){

  function gap(field, label){
    var we = !!(cs[field] && String(cs[field]).trim()), they = !!(ts[field] && String(ts[field]).trim());

        + " קיים אצלנו</h4><p>חסר אצלם — יתרון בתצוגת תוצאות החיפוש.</p></div>";
  }
  gap("meta_desc", "תיאור meta");
  gap("h1", "כותרת H1");

function contentSection(c, t){

        + "</b><span>"+dec(s.per_month)+" לחודש · "+num(s.pages)+" עמ׳</span></div>"
        + '<div class="mbar"><i style="width:'+(mx ? (s.per_month/mx*100) : 0).toFixed(1)
        + "%;background:"+col+";opacity:"+(s.editorial?"1":".35")+'"></i></div></div>';

    + '<p class="eyebrow">תוכן</p><h2 class="big">מי מפרסם יותר</h2>'
    + '<p class="body">סוגי התוכן נגזרים ממבנה הסייטמאפ של כל אתר. '
    + "הקצב מחושב מתאריך העדכון האחרון, לא מתאריך הפרסום.</p>"
    + a + b + "</div></div>";
}

function convId(){
  var s = "", cs = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  for(var i=0;i<20;i++) s += cs.charAt(Math.floor(Math.random()*cs.length));
  return s;
}
function parsePayload(p){
  if(!p) return null;
  var raw = p.results != null ? p.results : p;
  if(typeof raw === "string"){ try{ return JSON.parse(raw); }catch(e){ return null; } }
  return raw;
}
function adSearch(mcp, args){ return mcp.callTool("meta mcp", "ads_library_search", args); }
function errMsg(err){
  var c = err && err.code ? err.code : "";
  if(c === "server_not_connected") return "מחבר Meta אינו מחובר בחשבון הצופה.";
  if(c === "not_granted") return "לא ניתן אישור לגשת למחבר.";
  if(c === "rate_limited") return "יותר מדי בקשות — כדאי לנסות בעוד רגע.";
  if(c === "tool_error") return "הכלי החזיר שגיאה.";
  return "שגיאה" + (c ? " (" + c + ")" : "") + ".";
}

var B2B = ["לקליניק","לקוסמטיקאי","למכון","לרופא","מערכת לייזר","מכשיר לייזר",
  "רכישת מכשיר","החזר השקעה","טרייד אין","trade-in","מערכת ישנה","שדרוג מערכת",
  "הדגמה","דמו","demo","כנס מקצועי","הכשרה מקצועית","מפיץ","יבואן","נציג בלעדי",
  "משווק מורשה","אנשי מקצוע","בעלי קליניקות"];
var B2C = ["מבצע","חבילת טיפולים","קבעי תור","קבעו תור","תור פנוי","₪","תשלומים",
  "ללא התחייבות","שלחי לי הודעה","פגישת ייעוץ","סניפים","לתיאום תור","הנחה","מתנה"];
var GRAY = ["יד שני","יד 2","משומש","second hand","מחודש"];
function hasAny(t, list){
  var low = (t||"").toLowerCase();
  for(var i=0;i<list.length;i++) if(low.indexOf(list[i].toLowerCase()) > -1) return true;
  return false;
}
function classifyAd(pageId, pageName, text){
  var blob = (pageName||"")+" "+(text||"");
  if(String(pageId) === String(D.client.fbPageId)) return {k:"client", why:"העמוד שלנו"};
  for(var i=0;i<D.competitors.length;i++)
    if(D.competitors[i].fbPageId && String(pageId) === String(D.competitors[i].fbPageId))
      return {k:"competitor", why:"מתחרה מוכר"};
  if(hasAny(blob, GRAY)) return {k:"gray_market", why:"שפת מכירת יד־שנייה"};
  var b2b = hasAny(blob, B2B), b2c = hasAny(blob, B2C);
  if(b2b && !b2c) return {k:"competitor", why:"פנייה B2B — מפיץ שלא ברשימה"};
  if(b2b && b2c) return {k:"channel", why:"אותות מעורבים"};
  return {k:"channel", why:"פנייה לצרכן קצה — קליניקה"};
}

function embeddedScan(term){
  var sc = (D.scans||{})[term];
  if(!sc) return null;
  var pages = sc.pages.map(function(p){
    return {name:p.name, n:p.n, kind:p.kind,
            why: p.kind === "competitor" ? "מוכר ציוד לקליניקות"
               : p.kind === "client" ? "העמוד שלנו"
               : p.kind === "gray_market" ? "שפת מכירת יד־שנייה"
               : "פנייה לצרכן קצה — קליניקה",
            title:p.title, url:p.url};
  });
  return {total: sc.total, analyzed: sc.sampled != null ? sc.sampled : sc.pages.length,
          buckets: {client:sc.buckets.client||0, competitor:sc.buckets.competitor||0,
                    channel:sc.buckets.channel||0, gray_market:sc.buckets.gray_market||0},
          pages: pages, live:false, asOf: D.meta.dateHe};
}

function modelFromLive(data){
  var ads = data.ads || [];
  var B = {client:0, competitor:0, channel:0, gray_market:0}, byPage = {};
  ads.forEach(function(a){
    var txt = [a.ad_creative_link_title, a.ad_creative_body, a.ad_creative_link_description]
              .filter(Boolean).join(" ");
    var c = classifyAd(a.page_id, a.page_name, txt);
    B[c.k] = (B[c.k]||0) + 1;
    var k = String(a.page_id);
    if(!byPage[k]) byPage[k] = {name:a.page_name, n:0, kind:c.k, why:c.why,
                                title:a.ad_creative_link_title, url:a.ad_snapshot_url};
    byPage[k].n++;
  });
  return {
    total: data.estimated_total_count != null ? data.estimated_total_count : ads.length,
    analyzed: ads.length, buckets: B, live: true,
    pages: Object.keys(byPage).map(function(k){ return byPage[k]; })
                 .sort(function(a,b){ return b.n - a.n; })
  };
}

    if(!data) throw new Error("no payload");
    var M = modelFromLive(data);
    var LBL = {client:"אנחנו", competitor:"מתחרים", channel:"קליניקות", gray_market:"שוק אפור"};
    box.innerHTML = '<h3 class="mid-t">' + esc(kw) + " — מודעות פייסבוק ואינסטגרם</h3>"
      + '<p class="body"><b>' + num(M.total) + "</b> מודעות פעילות, נבדק עכשיו.</p>"
      + '<div class="grid4" style="margin-top:30px">'
      + ["competitor","client","channel","gray_market"].map(function(k){
          return '<div class="tile ' + k + '"><div class="v num">' + num(M.buckets[k] || 0)
            + '</div><div class="k">' + esc(LBL[k]) + "</div></div>"; }).join("")
      + "</div>";
  }catch(err){
    box.innerHTML = '<p class="fine">' + esc(errMsg(err)) + "</p>";
  }
}

function showResearch(keywords){
  if(!keywords || !keywords.length) return;
  var h = topbar("מחקר מילים · " + keywords.length);

  var absent = [], unresearched = [];
  keywords.forEach(function(k){
    var r = D.research[k];
    if(!r){ unresearched.push(k); return; }
    if(!r.counts.client) absent.push(k);
  });

  h += '<div class="phero rev"><div class="mid">'
    + '<p class="eyebrow" style="color:var(--brand)">מחקר מילות מפתח</p>'
    + '<h1 class="mega">' + esc(keywords.length === 1 ? keywords[0] : keywords.length + " מילות מפתח") + "</h1>"
    + '<p class="lead">חיפוש אורגני, מודעות גוגל, ומודעות פייסבוק ואינסטגרם.</p>'
    + "</div></div>";

  if(absent.length){
    h += '<div class="sect grey"><div class="mid rev">'
      + '<div class="verdictbox bad"><div class="big-i">' + absent.length + " מתוך " + (keywords.length - unresearched.length) + "</div>"
      + "<p>מילות המפתח שנבדקו <b>אינן מחזירות אותנו</b> באף תוצאה אורגנית בעמוד הראשון: "
      + esc(absent.join(" · ")) + "</p></div></div></div>";
  }

  if(unresearched.length){
    h += '<div class="sect tight"><div class="mid rev">'
      + '<p class="eyebrow">ממתין למחקר</p>'
      + '<h2 class="big">' + (unresearched.length === 1 ? "מילה אחת טרם נחקרה"
                                : unresearched.length + " מילים טרם נחקרו") + "</h2>"
      + '<p class="body">' + esc(unresearched.join(" · ")) + "</p>"
      + '<p class="fine">המחקר האורגני והמודעות בגוגל נאספים בריצה — הדף עצמו '
      + "אינו יכול לגלוש לגוגל. המילים האלה ייכנסו לריצה הבאה."
      + (LIVE ? " בינתיים מוצגת להן סריקת Meta חיה למטה." : "")
      + "</p></div></div>";
    unresearched.forEach(function(k, i){
      h += '<div class="sect tight grey"><div class="mid rev" id="lm' + i + '">'
        + '<div class="loading"><span class="spin"></span>סורק «' + esc(k) + "»…</div>"
        + "</div></div>";
    });
  }

  keywords.forEach(function(k){
    var r = D.research[k]; if(!r) return;
    var c = r.counts;
    h += '<div class="sect"><div class="mid rev">'
      + '<p class="eyebrow">מילת מפתח</p><h2 class="big">' + esc(k) + "</h2>"
      + '<p class="body">מתוך ' + r.organic.length + " תוצאות אורגניות: "
      + "<b>" + c.competitor + "</b> מתחרים · <b>" + c.channel + "</b> קליניקות · "
      + "<b>" + c.client + "</b> שלנו" + (c.other ? " · " + c.other + " אחר" : "") + "</p>";

    if(r.organic.length){
      h += '<div class="serp" style="margin-top:34px">';
      r.organic.forEach(function(o){
        h += '<div class="r"><div class="pos">' + (o.rank || "") + "</div><div>"
          + '<div class="t">' + esc(o.title || "") + "</div>"
          + '<div class="u">' + esc(o.domain || "") + "</div>"
          + (o.snippet ? '<div class="sn">' + esc(o.snippet) + "</div>" : "")
          + '<span class="tagv ' + esc(o.verdict || "other") + '">'
          + esc(VERD_HE[o.verdict] || o.verdict || "—")
          + (o.owner ? " · " + esc(o.owner) : "") + "</span>"
          + "</div></div>";
      });
      h += "</div>";
    }
    h += "</div></div>";

    if(r.gads && r.gads.length){
      h += '<div class="sect tight grey"><div class="mid rev">'
        + '<h3 class="mid-t">מודעות Google</h3>'
        + '<p class="body">מספר המודעות הפעילות שכל מפרסם מריץ לדומיין שלו.</p>'
        + '<div class="grid4" style="margin-top:32px">';
      r.gads.forEach(function(g){
        h += '<div class="tile ' + (g.verdict === "client" ? "client" : "competitor") + '">'
          + '<div class="v num">' + num(g.metric) + "</div>"
          + '<div class="k">' + esc(g.owner || g.domain || "") + "</div>"
          + '<div class="d">' + esc(g.domain || "") + "</div></div>";
      });
      h += "</div></div></div>";
    }

    var sc = (D.scans || {})[k];
    if(sc){
      h += '<div class="sect tight"><div class="mid rev">'
        + '<h3 class="mid-t">מודעות פייסבוק ואינסטגרם</h3>'
        + '<p class="body"><b>' + num(sc.total) + "</b> מודעות פעילות על המילה הזו.</p>"
        + '<div class="grid4" style="margin-top:32px">';
      ["competitor","client","channel","gray_market"].forEach(function(kk){
        var LBL = {client:"אנחנו", competitor:"מתחרים", channel:"קליניקות", gray_market:"שוק אפור"};
        h += '<div class="tile ' + kk + '"><div class="v num">' + num(sc.buckets[kk] || 0) + "</div>"
          + '<div class="k">' + esc(LBL[kk]) + "</div></div>";
      });
      h += "</div></div></div>";
    }
  });

  h += '<div class="sect tight"><div class="mid rev"><p class="fine">'
    + "המחקר בוצע בריצה של " + esc(D.meta.dateHe) + ". "
    + "חיפוש אורגני באינסטגרם, בפייסבוק ובטיקטוק חסום מאחורי חומת התחברות "
    + "ואינו נכלל — התחליף הוא נתוני המפרסמים מ-Meta Ad Library, שמכסים את שתי הרשתות."
    + "</p></div></div>";

  SCAN.innerHTML = h + foot();
  show("scan"); wireBack();
  if(LIVE) unresearched.forEach(function(k, i){ liveMetaBlock(k, "lm" + i); });
}

function foot(){
  return "<footer>"+esc(D.meta.clientName)+" · מצפן תחרות · ריצה #"+D.meta.runId
    + " · "+esc(D.meta.runAt)+"<br>"+D.logOk+" מתוך "+D.logTotal+" מקורות נאספו · "
    + D.competitors.length+" מתחרים כשירים · "+D.excluded.length+" נפסלו</footer>";
}

renderHome();
reveal(HOME);
})();
</script>
</body>
</html>
